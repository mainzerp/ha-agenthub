id: automation.update_morning_routine
agent: automation-agent
description: Update an existing automation (first turn proposes a patch and asks; nothing is saved)
snapshot: home_default
language: en
context: {source: ha, area_id: bedroom, device_id: satellite_bedroom}
preconditions:
  entity_overrides:
    - {entity_id: automation.morning_routine, state: "on", attributes: {id: "morning_routine_001", friendly_name: "Morning Routine"}}
llm:
  classify: |
    automation-agent (95%): Update the morning routine automation
  agents:
    automation-agent: |
      Updating the morning routine.
      ```json
      {"action": "update_automation", "entity": "morning routine", "parameters": {"set": {"triggers": [{"platform": "time", "at": "07:00:00"}]}}}
      ```
request:
  text: "change the morning routine to run at 7 AM"
expected:
  routed_agent: automation-agent
  service_calls: []
  speech_contains: ["Morning Routine", "replace triggers", "Shall I save this?"]
  speech_excludes: ["updated"]
